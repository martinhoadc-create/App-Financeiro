<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a2a6c">
<title>Finanças</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--primary:#0ea5e9;--border:#e2e8f0;--shadow:0 4px 24px rgba(0,0,0,.06);--radius:16px;--nav:#fff;--danger:#dc2626;--success:#059669;--warning:#f59e0b;--input:#f8fafc;--header-start:#1a2a6c;--header-end:#00d4ff;--card-receita:#0ea5e9;--card-despesa:#f59e0b;--card-saldo-pos:#10b981;--card-saldo-neg:#ef4444;--card-saldo-zero:#64748b;--card-servico:#3b82f6;--card-venda:#10b981;--card-media:#8b5cf6;--card-qtd:#ec4899;--card-porcentagem:#8b5cf6;--modal-border:#cbd5e1;--modal-border-focus:#0ea5e9;--modal-input-bg:#ffffff}
[data-theme=dark]{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--border:#334155;--shadow:0 4px 24px rgba(0,0,0,.3);--nav:#1e293b;--input:#1e293b;--header-start:#0c1445;--header-end:#0099cc;--card-receita:#0284c7;--card-despesa:#d97706;--card-saldo-pos:#059669;--card-saldo-neg:#dc2626;--card-saldo-zero:#475569;--card-servico:#2563eb;--card-venda:#059669;--card-media:#7c3aed;--card-qtd:#db2777;--card-porcentagem:#7c3aed;--modal-border:#475569;--modal-border-focus:#38bdf8;--modal-input-bg:#1e293b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:80px;min-height:100vh;transition:background .3s,color .3s;font-size:18px;line-height:1.5}
.header{background:linear-gradient(135deg,var(--header-start),var(--header-end));padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;min-height:90px;box-shadow:0 4px 20px rgba(26,42,108,.3)}
.header-left{display:flex;align-items:center;gap:14px}
.profile-pic{width:64px;height:64px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;border:3px solid rgba(255,255,255,.5);flex-shrink:0}
.profile-pic img{width:100%;height:100%;object-fit:cover}
.profile-pic .fallback{color:#fff;font-size:32px;font-weight:700}
.user-info .name{font-weight:700;font-size:20px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.15)}
.user-info .date{font-size:16px;color:rgba(255,255,255,.85);font-weight:500}
.header-right{display:flex;gap:8px}
.header-right button{width:40px;height:40px;border:none;border-radius:50%;cursor:pointer;font-size:18px;transition:all .2s;box-shadow:0 4px 12px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center}
.header-right button:active{transform:scale(.92)}
#langBtn{background:#e0f2fe;color:#0284c7}
#themeBtn{background:#fef3c7;color:#d97706}
[data-theme=dark] #langBtn{background:#1e3a5f;color:#7dd3fc}
[data-theme=dark] #themeBtn{background:#4c1d95;color:#fbbf24}
#langBtn::after{content:attr(data-label);font-size:12px;font-weight:700;margin-left:2px}
.github-status-header{width:40px;height:40px;border-radius:50%;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.3);font-size:20px;transition:all .3s}
.github-status-header.sync{color:#4ade80;border-color:#4ade80;background:rgba(74,222,128,.2)}
.github-status-header.error{color:#f87171;border-color:#f87171;background:rgba(248,113,113,.2)}
.github-status-header.loading{color:#fbbf24;border-color:#fbbf24;background:rgba(251,191,36,.2)}
.github-status-header.default{color:#60a5fa;border-color:#60a5fa;background:rgba(96,165,250,.2)}
@media(max-width:480px){.header{padding:10px 12px;min-height:76px}.profile-pic{width:52px;height:52px}.profile-pic .fallback{font-size:24px}.user-info .name{font-size:17px}.user-info .date{font-size:14px}.header-right button{width:34px;height:34px;font-size:16px}.github-status-header{width:34px;height:34px;font-size:18px}#langBtn::after{font-size:10px}}
.page{display:none;padding:12px}.page.active{display:block}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding:8px 0 env(safe-area-inset-bottom,8px);z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,.06)}
.bottom-nav button{background:0;border:0;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px;flex:1;font-weight:600}
.bottom-nav button i{font-size:22px}
.bottom-nav button span{font-size:13px}
.bottom-nav button.active{color:var(--primary)}
.bottom-nav .btn-add{background:var(--primary);color:#fff!important;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-16px;box-shadow:0 4px 16px rgba(14,165,233,.35);flex:0 0 50px;font-size:0}
.bottom-nav .btn-add i{font-size:26px}
.bottom-nav .btn-add:active{transform:scale(.92)}
@media(max-width:480px){.bottom-nav .btn-add{width:44px;height:44px;flex:0 0 44px;margin-top:-12px}.bottom-nav .btn-add i{font-size:22px}}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden}
.card-destaque{border-radius:var(--radius);padding:10px 12px;color:#fff;border-left:5px solid rgba(255,255,255,.3);box-shadow:var(--shadow);transition:all .3s;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:70px;overflow:hidden;width:100%}
.card-destaque .painel-desc{color:rgba(255,255,255,.95);font-size:15px;display:flex;align-items:center;gap:4px;font-weight:500;justify-content:center;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-destaque .painel-number-wrap{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:2px;max-width:100%;overflow:hidden}
.card-destaque .painel-number-wrap .moeda{font-size:13px;font-weight:600;opacity:.8;display:block;letter-spacing:.5px;width:100%;text-align:center}
.card-destaque .painel-number-wrap .painel-number{color:#fff;font-size:17px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.1);word-wrap:break-word;overflow-wrap:break-word;hyphens:auto;line-height:1.2;width:100%;text-align:center;max-width:100%;overflow:hidden}
.painel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.painel-grid-6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.section-title{font-size:20px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;color:var(--text)}
.section-title i{color:var(--primary)}
.grafico-container{width:100%;height:180px;position:relative}
.grafico-resumo-container{width:100%;position:relative}
.status-badge{padding:3px 12px;border-radius:20px;font-size:13px;font-weight:700;text-transform:uppercase;color:#fff!important;display:inline-block;flex-shrink:0;white-space:nowrap}
.status-badge.pago{background:#059669!important}
.status-badge.pendente{background:#dc2626!important}
.tipo-badge{padding:3px 12px;border-radius:20px;font-size:13px;font-weight:700;text-transform:uppercase;color:#fff;display:inline-block;flex-shrink:0;white-space:nowrap}
.tipo-badge.servico{background:#3b82f6}
.tipo-badge.venda{background:#10b981}
.tipo-badge.despesa{background:#f59e0b}
.filtro-status{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filtro-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:0;color:var(--muted);cursor:pointer;font-size:14px;font-weight:500;transition:all .2s}
.filtro-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.card-movimento{background:var(--card);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;border-left:4px solid var(--primary);border:1px solid var(--border);box-shadow:var(--shadow)}
.entry-desc{font-size:17px;font-weight:600;margin-bottom:2px}
.entry-value{font-size:19px;font-weight:800}
.entry-date{font-size:16px;color:var(--muted);font-weight:600}
.entry-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.entry-header-left{display:flex;align-items:center;gap:8px}
.entry-header-right{display:flex;align-items:center;gap:6px}
.entry-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn-actions{background:0;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 6px;border-radius:6px;transition:background .2s}
.btn-actions:hover{background:var(--border)}
.actions-dropdown{display:none;position:absolute;right:0;top:calc(100%+4px);background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.15);min-width:150px;z-index:60;overflow:hidden}
.actions-dropdown.open{display:block;animation:slideDown .2s}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.action-item{display:flex;align-items:center;gap:8px;padding:10px 14px;background:0;border:0;color:var(--text);font-size:15px;cursor:pointer;width:100%;text-align:left;transition:background .15s}
.action-item:hover{background:var(--input)}
.action-item.excluir{color:var(--danger)}
.action-item.excluir:hover{background:#fee2e2}
.action-item.status{color:var(--warning)}
.action-item.status:hover{background:#fef3c7}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center;padding:0}
.modal-overlay.active{display:flex}
.modal-content{background:var(--card);border-radius:var(--radius);width:100%;max-width:460px;max-height:80vh;padding:20px 16px 24px;overflow-y:auto;border:1px solid var(--border);box-shadow:0 -8px 40px rgba(0,0,0,.15);animation:slideUp .3s;margin-bottom:16px}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-content h3{font-size:20px;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--text)}
.modal-content h3 .btn-close-modal{background:transparent;border:none;font-size:28px;color:var(--muted);cursor:pointer;padding:0 6px;margin-left:auto;transition:color .2s}
.modal-content h3 .btn-close-modal:hover{color:var(--text)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:14px;font-weight:700;margin-bottom:4px;color:var(--muted);letter-spacing:.3px}
.form-group input,.form-group select{width:100%;padding:10px 14px;border:2px solid var(--modal-border);border-radius:10px;font-size:17px;background:var(--modal-input-bg);color:var(--text);transition:border-color .2s,box-shadow .2s;outline:none;font-weight:500}
.form-group input:focus,.form-group select:focus{border-color:var(--modal-border-focus);box-shadow:0 0 0 3px rgba(14,165,233,.15)}
.form-group input::placeholder{color:var(--muted);opacity:.6;font-weight:400}
.form-group input[readonly]{cursor:pointer;background:var(--input);border-style:dashed}
.modal-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.modal-actions button{flex:1;padding:12px;border:0;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;min-width:80px;transition:all .2s}
.modal-actions button:active{transform:scale(.95)}
.btn-primary{background:var(--primary);color:#fff;border:2px solid var(--primary)}
.btn-primary:hover{background:#0284c7;border-color:#0284c7}
.btn-secondary{background:var(--border);color:var(--text);border:2px solid var(--border)}
.btn-secondary:hover{background:var(--muted);color:#fff}
.btn-danger{background:var(--danger);color:#fff;border:2px solid var(--danger)}
.btn-danger:hover{background:#b91c1c;border-color:#b91c1c}
.btn-success{background:var(--success);color:#fff;border:2px solid var(--success)}
.btn-success:hover{background:#047857;border-color:#047857}
.btn-warning{background:var(--warning);color:#fff;border:2px solid var(--warning)}
.btn-warning:hover{background:#d97706;border-color:#d97706}
.btn-github{background:#24292e;color:#fff;border:2px solid #24292e}
.btn-github:hover{background:#1b1f23;border-color:#1b1f23}
.calc-btn{padding:14px;border:2px solid var(--border);border-radius:10px;font-size:22px;cursor:pointer;background:var(--input);color:var(--text);transition:all .2s;min-height:50px;font-weight:600}
.calc-btn:hover{background:var(--border)}
.calc-btn:active{transform:scale(.95)}
.calc-btn.op{background:var(--primary);color:#fff;border-color:var(--primary)}
.calc-btn.op:hover{background:#0284c7;border-color:#0284c7}
.calc-btn.clear{background:var(--danger);color:#fff;border-color:var(--danger)}
.calc-btn.clear:hover{background:#b91c1c;border-color:#b91c1c}
.calc-btn.back{background:var(--warning);color:#fff;border-color:var(--warning)}
.calc-btn.back:hover{background:#d97706;border-color:#d97706}
.calc-btn.confirm{background:var(--success);color:#fff;grid-column:span 2;border-color:var(--success)}
.calc-btn.confirm:hover{background:#047857;border-color:#047857}
.calc-btn.equals{background:#f97316;color:#fff;border-color:#f97316}
.calc-btn.equals:hover{background:#ea580c;border-color:#ea580c}
#calcDisplay{font-size:38px;font-weight:700;text-align:right;padding:14px 16px;border:2px solid var(--primary);border-radius:12px;background:var(--input);margin-bottom:12px;min-height:60px;font-family:monospace;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:14px 24px;border-radius:12px;font-size:18px;font-weight:700;z-index:300;box-shadow:0 8px 40px rgba(0,0,0,.5);max-width:90%;text-align:center;border-left:6px solid #0ea5e9}
.toast.success{border-left-color:#22c55e;background:#0a1a0f}
.toast.error{border-left-color:#ef4444;background:#1a0a0a}
.date-picker-overlay{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.4)}
.date-picker-overlay.open{display:block}
.date-picker-popup{display:none;position:fixed;bottom:0;left:0;right:0;z-index:401;background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 -8px 40px rgba(0,0,0,.2);max-width:460px;margin:0 auto 16px;border:1px solid var(--border);animation:slideUp .3s}
.date-picker-popup.open{display:block}
.dp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dp-header .dp-month-year{font-size:19px;font-weight:700}
.dp-header .dp-nav{background:0;border:0;font-size:20px;color:var(--text);cursor:pointer;padding:2px 10px;border-radius:6px}
.dp-header .dp-nav:hover{background:var(--border)}
.dp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:6px;font-weight:600;font-size:14px;color:var(--muted)}
.dp-weekdays .sunday{color:#dc2626}
.dp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:12px}
.dp-day{padding:8px 0;border:0;background:0;border-radius:50%;cursor:pointer;font-size:16px;color:var(--text);aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:500}
.dp-day:hover{background:var(--border)}
.dp-day.selected{background:var(--primary);color:#fff!important}
.dp-day.sunday{color:#dc2626!important;font-weight:700!important}
.dp-footer{display:flex;gap:6px}
.dp-footer button{flex:1;padding:8px;border:0;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.dp-btn-clear{background:#f59e0b;color:#fff}
.dp-btn-clear:hover{background:#d97706}
.dp-btn-cancel{background:var(--border);color:var(--text)}
.dp-btn-cancel:hover{background:var(--muted);color:#fff}
.dp-btn-confirm{background:var(--primary);color:#fff}
.dp-btn-confirm:hover{background:#0284c7}
.btn-pdf{background:#dc2626;color:#fff;padding:6px 14px;border-radius:10px;border:0;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:15px}
.btn-pdf:hover{background:#b91c1c}
.btn-github-backup{background:#24292e;color:#fff;padding:6px 10px;border:0;border-radius:10px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:16px;min-width:36px;height:36px;justify-content:center;border:2px solid #24292e;transition:all .2s}
.btn-github-backup:hover{background:#1b1f23}
.btn-github-backup:disabled{opacity:.5;cursor:not-allowed}
.btn-github-backup.github-save{background:#28a745;border-color:#28a745}
.btn-github-backup.github-save:hover{background:#1e7e34;border-color:#1e7e34}
.btn-github-backup.github-restore{background:#0366d6;border-color:#0366d6}
.btn-github-backup.github-restore:hover{background:#0250a3;border-color:#0250a3}
.btn-github-backup.github-unlink{background:#dc2626;border-color:#dc2626}
.btn-github-backup.github-unlink:hover{background:#b91c1c;border-color:#b91c1c}
.btn-github-backup.github-config{background:#24292e;border-color:#24292e}
.backup-status-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0}
.github-status{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);padding:2px 10px;border-radius:20px;background:var(--input);border:1px solid var(--border);transition:all .3s}
.github-status.sync{color:#059669;border-color:#059669;background:rgba(5,150,105,.1)}
.github-status.error{color:#dc2626;border-color:#dc2626;background:rgba(220,38,38,.1)}
.github-status.default{color:#0ea5e9;border-color:#0ea5e9;background:rgba(14,165,233,.1)}
.paginacao{display:flex;justify-content:center;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.paginacao button{padding:4px 12px;border:0;border-radius:6px;background:var(--primary);color:#fff;cursor:pointer;font-weight:600;font-size:14px}
.paginacao button:disabled{opacity:.4;cursor:not-allowed}
.paginacao .info{font-size:15px;font-weight:600;color:var(--muted)}
.lista-container{min-height:180px}
.filtro-mes-ano{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;flex-wrap:nowrap}
.filtro-mes-ano button{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:16px;transition:all .2s;display:flex;align-items:center;gap:4px;font-weight:600;white-space:nowrap;flex-shrink:0}
.filtro-mes-ano button:hover{background:var(--border)}
.filtro-mes-ano .mes-ano-label{font-size:20px;font-weight:700;color:var(--text);min-width:110px;text-align:center;white-space:nowrap;flex-shrink:0}
.relatorio-card{display:flex;flex-direction:column;padding:10px;border-radius:var(--radius);border-left:4px solid;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);min-height:70px;align-items:center;text-align:center;overflow:hidden;width:100%}
.relatorio-card .relatorio-label{font-size:16px;color:var(--muted);font-weight:500;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.relatorio-card .relatorio-valor-wrap{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:2px;max-width:100%;overflow:hidden}
.relatorio-card .relatorio-valor-wrap .moeda{font-size:14px;font-weight:600;opacity:.7;display:block;letter-spacing:.5px;width:100%;text-align:center}
.relatorio-card .relatorio-valor-wrap .valor{font-size:20px;font-weight:800;word-wrap:break-word;overflow-wrap:break-word;hyphens:auto;line-height:1.2;width:100%;text-align:center;max-width:100%;overflow:hidden}
.relatorio-card .relatorio-valor-wrap .valor.receita{color:#0ea5e9}
.relatorio-card .relatorio-valor-wrap .valor.despesa{color:#f59e0b}
.relatorio-card .relatorio-valor-wrap .valor.saldo-positivo{color:#10b981}
.relatorio-card .relatorio-valor-wrap .valor.saldo-negativo{color:#ef4444}
.resumo-por-tipo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.resumo-tipo-item{padding:10px;border-radius:10px;text-align:center;border:2px solid var(--border);background:var(--bg);display:flex;flex-direction:column;align-items:center;overflow:hidden;width:100%}
.resumo-tipo-item .tipo-label{font-size:13px;color:var(--muted);font-weight:600;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resumo-tipo-item .tipo-value-wrap{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:2px;max-width:100%;overflow:hidden}

<script>
const Utils = {
  id: () => Date.now().toString(36) + Math.random().toString(36).slice(2,6),
  today: () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; },
  escape: s => { if(!s) return ''; const m = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}; return String(s).replace(/[&<>"']/g, c => m[c]); },
  parseMoney: v => { if(!v) return 0; let s = String(v).replace(/[^0-9,.-]/g,''); if(I18n.lang === 'pt'){ s = s.replace(/\./g,'').replace(',','.'); } else { s = s.replace(/,/g,''); } const n = parseFloat(s); return isNaN(n) ? 0 : n; },
  filterByMonth: (items, m, y) => items.filter(i => { if(!i.data) return false; const p = i.data.split('-'); return parseInt(p[0]) === y && parseInt(p[1])-1 === m; }),
  safeEval: e => { const s = e.replace(/\s/g,''); if(!/^[\d+\-*/.()]+$/.test(s)) throw Error('Expressão inválida'); return Function(`"use strict";return(${s})`)(); },

  async restaurarBackup(){ if(!this.token){ App.showToast(I18n.t('configureToken'), false); return null; } if(this._loading) return null; this._loading = true; this._status = 'loading'; this.atualizarStatusUI(); try { App.showToast(I18n.t('restoringCloud'), true); let result = this._destino === 'repo' ? await this._obterArquivo() : await this._obterGist(); if(!result){ App.showToast(I18n.t('noBackupCloud'), false); this._loading = false; this._status = 'error'; this.atualizarStatusUI(); return null; } if(!result.content.financas || result.content.financas.length === 0){ App.showToast(I18n.t('backupVazio'), false); this._loading = false; this._status = 'error'; this.atualizarStatusUI(); return null; } App.showToast(I18n.t('backupRestored'), true); this._loading = false; this._status = 'sync'; this.atualizarStatusUI(); return result.content; } catch(e){ console.error(e); if(e.message === 'corrupted') App.showToast(I18n.t('backupCorrupted'), false); else if(e.message.includes('Failed to fetch') || e.message.includes('Network')) App.showToast(I18n.t('networkError'), false); else App.showToast(I18n.t('genericError',{error:e.message}), false); this._loading = false; this._status = 'error'; this.atualizarStatusUI(); return null; } },
  async _obterArquivo(){ const r = await fetch(`https://api.github.com/repos/${this._repoName}/contents/backup.json`, { headers: this.getHeaders() }); if(r.status === 404) return null; if(r.status === 429) throw Error('Rate limit exceeded'); if(!r.ok) throw Error('HTTP '+r.status); const d = await r.json(); try { const decoded = decodeURIComponent(escape(atob(d.content))); return { sha: d.sha, content: JSON.parse(decoded) }; } catch { throw Error('corrupted'); } },
  async _salvarGist(data){ const content = btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)))); const r = await fetch('https://api.github.com/gists', { headers: this.getHeaders() }); if(r.status === 429) throw Error('Rate limit exceeded'); if(!r.ok) throw Error('HTTP '+r.status); const gists = await r.json(); const existing = gists.find(g => g.description === this._gistId); const files = {}; files[this._gistName] = { content }; if(existing){ const u = await fetch(`https://api.github.com/gists/${existing.id}`, { method: 'PATCH', headers: this.getHeaders(), body: JSON.stringify({ description: this._gistId, files }) }); if(u.status === 429) throw Error('Rate limit exceeded'); if(!u.ok) throw Error('HTTP '+u.status); } else { const c = await fetch('https://api.github.com/gists', { method: 'POST', headers: this.getHeaders(), body: JSON.stringify({ description: this._gistId, public: false, files }) }); if(c.status === 429) throw Error('Rate limit exceeded'); if(!c.ok) throw Error('HTTP '+c.status); } },
  async _obterGist(){
    try {
      const r = await fetch('https://api.github.com/gists', { headers: this.getHeaders() });
      if(r.status === 429) throw Error('Rate limit exceeded');
      if(!r.ok) return null;
      const gists = await r.json();
      const found = gists.find(g => g.description === this._gistId);
      if(!found) return null;
      const file = found.files[this._gistName];
      if(!file) return null;
      const c = await fetch(file.raw_url).then(res => res.text());
      try { return { id: found.id, content: JSON.parse(c) }; }
      catch { throw Error('corrupted'); }
    } catch(e){
      if(e.message.includes('Rate limit')) throw e;
      return null;
    }
  },
  async fazerBackupAutomatico(){ if(!this.token || !navigator.onLine) return false; try { return await this.salvarBackup(await Storage.getBackupObject()); } catch { return false; } },
  atualizarStatusUI(){ const e = document.getElementById('githubStatus'); if(e){ const i = e.querySelector('i'), tx = e.querySelector('span'); if(this._loading){ i.className = 'fas fa-spinner fa-pulse'; i.style.color = '#f59e0b'; tx.textContent = I18n.t('carregando'); e.className = 'github-status'; } else if(this.token){ if(this._status === 'sync'){ i.className = 'fas fa-check-circle'; i.style.color = '#059669'; tx.textContent = I18n.t('githubConectado'); e.className = 'github-status sync'; } else if(this._status === 'error'){ i.className = 'fas fa-exclamation-circle'; i.style.color = '#dc2626'; tx.textContent = I18n.t('githubErro'); e.className = 'github-status error'; } else { i.className = 'fas fa-cloud-upload-alt'; i.style.color = '#0ea5e9'; tx.textContent = I18n.t('githubConfigurado'); e.className = 'github-status default'; } } else { i.className = 'fas fa-cloud'; i.style.color = '#64748b'; tx.textContent = I18n.t('githubNaoConfigurado'); e.className = 'github-status'; } } this._atualizarHeaderStatus(); },
  _atualizarHeaderStatus(){ const e = document.getElementById('githubStatusHeader'); if(!e) return; if(!this.token){ e.style.display = 'none'; return; } e.style.display = 'flex'; let icon = 'fa-cloud', cls = 'default', title = ''; if(this._loading){ icon = 'fa-spinner fa-pulse'; cls = 'loading'; title = I18n.t('carregando'); } else if(this._status === 'sync'){ icon = 'fa-check-circle'; cls = 'sync'; title = I18n.t('githubConectado'); } else if(this._status === 'error'){ icon = 'fa-exclamation-circle'; cls = 'error'; title = I18n.t('githubErro'); } else { icon = 'fa-cloud-upload-alt'; cls = 'default'; title = I18n.t('githubConfigurado'); } e.className = 'github-status-header '+cls; e.innerHTML = `<i class="fas ${icon}" title="${title}"></i>`; }
};

  _atualizarOpcoesLimpeza(){ const container = document.getElementById('limpezaOpcoes'); const anos = this._getAnosComLancamentos(); const anosSemPrimeiro = anos.slice(1); let html = `<label><input type="radio" name="limpezaPeriodo" value="todos" checked><span>${I18n.t('limpezaTodos')}</span></label>`; if(anos.length > 1){ const anoAtual = anos[0]; const seta = this._limpezaExpandido ? '∧' : '∨'; html += `<button class="modal-limpeza-ver-mais" onclick="App.toggleAnosLimpeza()" style="margin-bottom:2px"><span style="display:inline-block;width:18px;text-align:center;">${seta}</span> ${anoAtual}</button>`; } if(this._limpezaExpandido && anosSemPrimeiro.length > 0){ anosSemPrimeiro.forEach(a => { html += `<label><input type="radio" name="limpezaPeriodo" value="${a}"><span>${a}</span></label>`; }); } html += `<label><input type="radio" name="limpezaPeriodo" value="perfil"><span>${I18n.t('limparPerfil')}</span></label><label><input type="radio" name="limpezaPeriodo" value="todosDados"><span>${I18n.t('limparTudo')}</span></label>`; container.innerHTML = html; },

  renderList(){
    const c = document.getElementById('page-lista');

    if(this.listaPagina > totalPages) this.listaPagina = totalPages;

    GitHubBackup.atualizarStatusUI();
  },

  gerarPDF(){
    const container = document.querySelector('#page-relatorio');
    if(!container){ this.showToast('Erro ao gerar PDF', false); return; }
    const clone = container.cloneNode(true);
    clone.querySelector('.backup-status-bar')?.remove();
    const toolCard = clone.querySelector('.card:has(.btn-pdf)');
    if(toolCard) toolCard.remove();
    const anoNav = clone.querySelector('.filtro-ano-container');
    if(anoNav) anoNav.remove();
    const tabela = clone.querySelector('table');
    if(tabela){ tabela.style.width = '100%'; tabela.style.tableLayout = 'auto'; tabela.style.minWidth = '700px'; }
    const card = clone.querySelector('.card-lista-completa');
    if(card){ card.style.overflow = 'visible'; card.style.padding = '0'; }
    clone.style.display = 'block';
    clone.style.background = Theme.current === 'dark' ? '#1e293b' : '#fff';
    clone.style.padding = '16px';
    clone.style.borderRadius = '16px';
    clone.style.width = 'auto';
    const temp = document.createElement('div');
    temp.style.cssText = 'position:absolute;left:-9999px;top:0;width:900px;';
    temp.appendChild(clone);
    document.body.appendChild(temp);
    setTimeout(() => {
      html2canvas(temp, { scale: 2, useCORS: true, backgroundColor: Theme.current === 'dark' ? '#1e293b' : '#fff', width: 900 })
        .then(canvas => {
          const img = canvas.toDataURL('image/png');
          const pdf = new window.jspdf.jsPDF('p','mm','a4');
          const pw = pdf.internal.pageSize.getWidth();
          const ph = (canvas.height * pw) / canvas.width;
          pdf.addImage(img, 'PNG', 0, 0, pw, ph);
          pdf.save('relatorio_financas.pdf');
          this.showToast(I18n.t('pdfDownloaded'), true);
          document.body.removeChild(temp);
        })
        .catch(() => { this.showToast('Erro ao gerar PDF', false); document.body.removeChild(temp); });
    }, 300);
  },

  navegarPainel(d){ this.painelMes += d; if(this.painelMes > 11){ this.painelMes = 0; this.painelAno++; } else if(this.painelMes < 0){ this.painelMes = 11; this.painelAno--; } this.renderDashboard(); },
  navegarLista(d){ this.listaMes += d; if(this.listaMes > 11){ this.listaMes = 0; this.listaAno++; } else if(this.listaMes < 0){ this.listaMes = 11; this.listaAno--; } this.listaPagina = 1; this.renderList(); },
  mudarPaginaLista(d){ this.listaPagina += d; this.renderList(); },
  navegarRelatorioAno(d){ this.relatorioAno += d; this.renderReport(); },
  navegarResumo(d){ this.filtroMes += d; if(this.filtroMes > 11){ this.filtroMes = 0; this.filtroAno++; } else if(this.filtroMes < 0){ this.filtroMes = 11; this.filtroAno--; } this.renderResumo(); },
  filtrarLista(s){ this.filtroStatus = s; document.querySelectorAll('.filtro-btn').forEach(b => { b.classList.toggle('active', b.dataset.filtro === s); }); this.listaPagina = 1; this.renderList(); },

  init(){
    Storage.init(); Theme.init(); I18n.init(); Calculator.init(); DatePickerGlobal.init(); GitHubBackup.init();
    document.getElementById('fotoInput').addEventListener('change', function(e){ const file = e.target.files[0]; if(!file) return; if(file.size > 4.5 * 1024 * 1024){ App.showToast(I18n.t('photoTooLarge'), false); e.target.value = ''; return; } const reader = new FileReader; reader.onload = ev => { localStorage.setItem('foto', ev.target.result); App.atualizarFotoPerfil(); App.atualizarFotoPerfilModal(); App.showToast(I18n.t('photoUpdated'), true); }; reader.readAsDataURL(file); e.target.value = ''; });
    document.addEventListener('click', function(e) {
      const btn = e.target.closest('.btn-actions');
      if(btn){ e.stopPropagation(); App.toggleMenu(btn, e); return; }
      if(!e.target.closest('.actions-menu-container')){ document.querySelectorAll('.actions-dropdown.open').forEach(d => d.classList.remove('open')); }
    });
    Storage.getAll().then(entries => {
      this.entries = entries; this.filtroStatus = 'todos'; this._jaAlertou = false;
      const n = new Date; this.filtroMes = n.getMonth(); this.filtroAno = n.getFullYear(); this.relatorioAno = n.getFullYear();
      this.painelMes = n.getMonth(); this.painelAno = n.getFullYear(); this.listaMes = n.getMonth(); this.listaAno = n.getFullYear(); this.listaPagina = 1;
      this._renderCurrentPage();
      const nome = localStorage.getItem('nome') || I18n.t('perfil'); document.getElementById('userName').textContent = nome;
      document.getElementById('headerDate').textContent = I18n._formatHeaderDate(); this.atualizarFotoPerfil(); I18n.updateUI(); this._alertarPendencias();
    });
  }
};

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
